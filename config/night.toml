# 🌙 Project Night - User Configuration (TOML Format)
# Best used for human-editable, top-level settings and desktop defaults.
# Stored at: ~/.config/night/night.toml

[general]
autostart_daemons = true
default_tag = "1"
border_width = 2
inner_gaps = 6.0
outer_gaps = 10.0
theme = "Night"
# primary_monitor = "eDP-1"

[apps]
terminal = "alacritty"
alt_terminal = "alacritty"
launcher = "fuzzel"
minimal_launcher = "fuzzel"
file_manager = "alacritty -e yazi"
term_file_manager = "yazi"
browser = "zen-browser"
alt_browser = "zen-browser"
media_player = "vivi"
lock_cmd = "swaylock -c 1a1b26"

[gamma]
enabled = false
day_temp = 6500
night_temp = 3800
