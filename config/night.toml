# 🌙 Project Night - User Configuration (TOML Format)
# Best used for human-editable, top-level settings and desktop defaults.
# Stored at: ~/.config/night/night.toml

[general]
autostart_daemons = true
default_tag = "1"
border_width = 2
inner_gaps = 6.0
outer_gaps = 10.0
# primary_monitor = "eDP-1"

[apps]
terminal = "alacritty"
alt_terminal = "rio"
launcher = "anyrun"
minimal_launcher = "yofi"
file_manager = "favnyr"
term_file_manager = "yazi"
browser = "zen-browser"
alt_browser = "brave"
lock_cmd = "veila"

[gamma]
enabled = false
day_temp = 6500
night_temp = 3800


